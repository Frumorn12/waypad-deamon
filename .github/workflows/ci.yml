name: daemon-ci

on:
  push:
  pull_request:

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Both platforms are reported even when one fails: knowing a change broke
      # Windows only, or both, is the whole point of the matrix.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      # Formatting is platform independent, so it is checked once rather than
      # producing the same complaint twice.
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Build
        run: cargo build --workspace --locked
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The ignored ones move a real mouse or need a live desktop, neither of
      # which a runner has.
      - name: Test
        run: cargo test --workspace --locked

  # The Linux daemon is the one that predates this work, so a change that
  # compiles for Windows but breaks Wayland has to be caught here rather than
  # by someone's Hyprland session.
  linux-backends:
    name: linux backends type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p waypad-linux --all-targets --locked
